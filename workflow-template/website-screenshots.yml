name: Weekly website screenshots
on:
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-screenshot-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Restore last successful images and state
        uses: actions/cache/restore@v4
        with:
          path: monitor-data
          key: screenshot-history-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            screenshot-history-${{ github.repository }}-
      - name: Capture and compare
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SCREENSHOT_WEBHOOK_URL: ${{ secrets.SCREENSHOT_WEBHOOK_URL }}
          SCREENSHOT_WEBHOOK_KIND: ${{ vars.SCREENSHOT_WEBHOOK_KIND || 'slack' }}
        run: python monitor.py
      - name: Save history even if a URL failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: monitor-data
          key: screenshot-history-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Job summary
        if: always()
        run: |
          if [ -f monitor-data/report.md ]; then
            cat monitor-data/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: monitor-data/
          retention-days: 30
          if-no-files-found: warn
